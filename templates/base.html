<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}مدقق التصميم العربي{% endblock %}</title>
<style>
@font-face{font-family:"Kufi";src:url("{{ url_for('static', filename='fonts/NotoKufiArabic-Regular.ttf') }}");font-weight:400}
@font-face{font-family:"Kufi";src:url("{{ url_for('static', filename='fonts/NotoKufiArabic-Medium.ttf') }}");font-weight:500}
@font-face{font-family:"Kufi";src:url("{{ url_for('static', filename='fonts/NotoKufiArabic-Bold.ttf') }}");font-weight:700}
@font-face{font-family:"Kufi";src:url("{{ url_for('static', filename='fonts/NotoKufiArabic-ExtraBold.ttf') }}");font-weight:800}
@font-face{font-family:"Wide";src:url("{{ url_for('static', filename='fonts/DejaVuSans-Bold.ttf') }}");font-weight:700}
:root{--black:#000;--ink:#0a0a0a;--panel:#111;--line:#262626;--grey:#d9d7d7;--mut:#9a9898;--white:#fff;--green:#86f282;--err:#ff5d5d;--warn:#ffb84d}
*{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;font-family:"Kufi","Noto Kufi Arabic",Tahoma,Arial,sans-serif;background:var(--black);color:var(--white);line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:baseline;gap:14px;text-decoration:none}
.brand b{font-weight:800;font-size:20px}
.mark{font-family:"Wide",Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;direction:ltr;color:var(--grey);text-transform:lowercase}
.mark i{font-style:normal;color:var(--green)}
.tag{font-size:13px;color:var(--mut)}
.hero{padding:72px 0 36px}
.eyebrow{font-family:"Wide",Arial,sans-serif;font-size:12px;letter-spacing:.08em;color:var(--green);direction:ltr;text-align:right;text-transform:lowercase;margin-bottom:18px}
h1{font-weight:800;font-size:clamp(40px,7vw,84px);line-height:1.15;margin:0 0 18px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--green)}
h2{font-weight:800;font-size:26px;margin:0 0 14px}
h3{font-weight:700;font-size:18px;margin:0}
.lead{color:var(--grey);font-size:19px;max-width:760px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:28px;margin:20px 0}
.sec{margin:56px 0 0}
.num2{font-family:"Wide",Arial,sans-serif;color:var(--green);font-size:13px;direction:ltr;display:inline-block;margin-left:10px}
label{display:block;font-weight:700;margin:18px 0 8px;color:var(--grey);font-size:15px}
input[type=text],input[type=number],select,textarea{width:100%;padding:14px 16px;border:1px solid #333;border-radius:2px;font:inherit;background:#000;color:var(--white)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--green);outline-offset:0}
textarea{min-height:130px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #444;border-radius:4px;padding:40px 20px;text-align:center;cursor:pointer;background:#050505;transition:.15s}
.drop:hover,.drop.on{border-color:var(--green);background:#0b140b}
.drop b{font-size:20px}.drop span{color:var(--mut);font-size:14px}
.drop input{display:none}
.drop .fn{color:var(--green);font-weight:700;direction:ltr}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#000;border:0;border-radius:2px;padding:16px 34px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none}
.btn:hover{background:#a6ffa2}
.btn.ghost{background:transparent;color:var(--white);border:1px solid #444;font-weight:700;padding:13px 24px;font-size:15px}
.btn.ghost:hover{border-color:var(--green);color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.grid3>div{background:var(--black);padding:22px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.hero{padding:44px 0 20px}}
.err{background:#1a0707;border:1px solid #5a1a1a;color:#ffb0b0;padding:12px 16px;border-radius:2px;margin:16px 0}
.note{font-size:14px;color:var(--mut)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer;font-weight:700;color:var(--grey)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{border:1px solid #333;padding:6px 14px;font-size:14px;color:var(--grey);border-radius:99px}
.chip b{font-family:"Wide",Arial,sans-serif;font-size:11px;color:var(--green);margin-left:8px}
.badge{display:inline-block;padding:1px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#000}
.b-error{background:var(--err)}.b-warn{background:var(--warn)}.b-clean{background:var(--green)}.b-not_run{background:#555;color:#ddd}.b-flagged{background:var(--err)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:30px 0}
.stats>div{background:var(--black);padding:24px}
.stats b{display:block;font-weight:800;font-size:54px;line-height:1.1;font-family:"Wide",Arial,sans-serif}
.stats span{color:var(--grey);font-size:15px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stats b{font-size:38px}}
.actions{display:flex;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td{padding:16px 10px;border-top:1px solid var(--line);vertical-align:top;text-align:right}
.en{direction:ltr;text-align:left;color:var(--mut);font-size:13.5px;font-family:Arial,sans-serif;line-height:1.55}
.meta{font-size:13px;color:var(--mut)}
.finding{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:28px 0;border-top:1px solid var(--line)}
.num{width:44px;height:44px;border-radius:50%;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:"Wide",Arial}
.n-error{background:var(--err)}.n-warn{background:var(--warn)}
.fix{margin:14px 0 8px;border-right:3px solid var(--green);background:#0a130a;padding:12px 16px}
.fix b{color:var(--green);display:block;font-size:13px;letter-spacing:.02em}
.crop{max-width:100%;border:1px solid #333;border-radius:2px;margin-top:12px;background:#fff}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag2{font-size:12.5px;border:1px solid #333;border-radius:99px;padding:2px 12px;color:var(--grey)}
.tag2.code{border-color:#2f6a2d;color:var(--green)}
.tone{display:grid;grid-template-columns:1fr 2fr;gap:28px;align-items:center}
.tone big{font-weight:800;font-size:40px;display:block;line-height:1.2}
.bar{height:14px;display:flex;background:#222;border-radius:2px;overflow:hidden;direction:rtl}
.bar i{display:block;height:100%}
.bar .f{background:var(--grey)}.bar .c{background:var(--green)}
.legend{display:flex;gap:18px;margin-top:10px;font-size:14px;color:var(--grey)}
.legend s{display:inline-block;width:10px;height:10px;margin-left:6px;text-decoration:none}
@media(max-width:760px){.tone{grid-template-columns:1fr}}
.filters{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.filters button{background:transparent;color:var(--grey);border:1px solid #333;border-radius:99px;padding:5px 16px;font:inherit;font-size:14px;cursor:pointer}
.filters button.on{background:var(--white);color:#000;border-color:var(--white)}
.pageimg{width:100%;border:1px solid #333;border-radius:2px;background:#fff}
footer{border-top:1px solid var(--line);margin-top:80px;padding:26px 0;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><b>مدقق التصميم العربي</b><span class="mark">arabic checker<i>_</i></span></a><span class="tag">بلا حسابات · يُحذف الملف بعد الفحص</span></div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
<footer><div class="wrap">الفحص بكود ثابت: الملف نفسه يعطي النتيجة نفسها. الأداة تُكمل نظر المدير الفني ولا تحل محله.</div></footer>
</body></html>
